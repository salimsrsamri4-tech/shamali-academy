<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تشخيص رفع الملفات</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:sans-serif;direction:rtl;background:#f1f5f9;padding:20px;color:#0f172a;}
h1{font-size:16px;margin-bottom:6px;}
p{font-size:12px;color:#64748b;margin-bottom:16px;line-height:1.7;}
button{background:#b81d22;color:#fff;border:none;border-radius:8px;padding:14px 24px;font-size:14px;font-weight:700;cursor:pointer;width:100%;}
button:disabled{opacity:.6;}
#out{margin-top:16px;background:#fff;border:1.5px solid #e2e8f0;border-radius:8px;padding:14px;font-size:12px;white-space:pre-wrap;word-break:break-word;direction:ltr;text-align:left;min-height:60px;}
.ok{color:#15803d;font-weight:700;}
.err{color:#dc2626;font-weight:700;}
</style>
</head>
<body>
<h1>🔧 تشخيص رفع صور الهوية</h1>
<p>هذه الصفحة تجرب نفس عملية رفع الصورة بالضبط (بصورة اختبارية صغيرة جدًا) وتعرض النتيجة أو الخطأ الحقيقي هنا مباشرة. صوّر الشاشة بعد الضغط وأرسلها.</p>
<button id="btn" onclick="runTest()">▶️ تشغيل الاختبار</button>
<div id="out">النتيجة راح تظهر هنا...</div>

<script>
var UPLOAD_URL = 'https://script.google.com/macros/s/AKfycbzpd5cr0k04BfZJ7-9-qLs3IzE-F2Ke7_3VgMPa-k_X-cwa87bmf0Qt4qV7v9Kb9eIZ/exec';
// صورة اختبارية 1x1 بكسل بصيغة base64
var TEST_B64 = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=';

function runTest(){
  var btn = document.getElementById('btn');
  var out = document.getElementById('out');
  btn.disabled = true;
  out.textContent = 'جارٍ الإرسال إلى:\n' + UPLOAD_URL + '\n\n(الرجاء الانتظار)';
  out.className = '';

  var startTime = Date.now();

  fetch(UPLOAD_URL, {
    method: 'POST',
    body: JSON.stringify({file: TEST_B64, mimeType: 'image/png', filename: 'اختبار_تشخيص.png'})
  }).then(function(r){
    var elapsed = Date.now() - startTime;
    out.textContent = 'استلمنا استجابة من الخادم بعد ' + elapsed + ' ملي ثانية\n';
    out.textContent += 'HTTP Status: ' + r.status + ' ' + r.statusText + '\n';
    out.textContent += 'Response Type: ' + r.type + '\n';
    out.textContent += 'Redirected: ' + r.redirected + '\n';
    out.textContent += 'Final URL: ' + r.url + '\n';
    out.textContent += 'Content-Type Header: ' + (r.headers.get('content-type') || '(غير موجود)') + '\n\n';
    return r.text();
  }).then(function(text){
    out.textContent += 'طول محتوى الاستجابة: ' + text.length + ' حرف\n';
    out.textContent += 'محتوى الاستجابة (JSON مُرمّز حتى تظهر أي رموز مخفية):\n' + JSON.stringify(text) + '\n\n';
    out.textContent += 'المحتوى الخام:\n' + text;
    try {
      var json = JSON.parse(text);
      if(json.id || json.url){
        out.innerHTML += '\n\n<span class="ok">✅ نجح الرفع! الملف تم إنشاؤه بنجاح.</span>';
      } else if(json.error){
        out.innerHTML += '\n\n<span class="err">❌ الخادم استجاب لكن برسالة خطأ: ' + json.error + '</span>';
      }
    } catch(e){
      out.innerHTML += '\n\n<span class="err">⚠️ الاستجابة ليست JSON صالح (قد تكون صفحة HTML/تسجيل دخول أو فاضية)</span>';
    }
    btn.disabled = false;
  }).catch(function(err){
    var elapsed = Date.now() - startTime;
    out.innerHTML = '<span class="err">❌ فشل الطلب نفسه (لم تصل أي استجابة) بعد ' + elapsed + ' ملي ثانية</span>\n\n';
    out.textContent += 'نوع الخطأ: ' + err.name + '\n';
    out.textContent += 'الرسالة: ' + err.message + '\n\n';
    out.textContent += 'هذا غالبًا يعني: الطلب محظور بسبب إعدادات CORS في Google Apps Script، أو لا يوجد اتصال بالإنترنت.';
    btn.disabled = false;
  });
}
</script>
</body>
</html>
