<!doctype html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps Script Code</title>
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0}
  .bar{position:sticky;top:0;display:flex;gap:12px;align-items:center;padding:14px 16px;background:#1e293b}
  button{min-height:48px;padding:0 24px;border:0;border-radius:10px;background:#16a34a;color:#fff;font-size:17px;font-weight:700;cursor:pointer}
  #msg{font-size:15px}
  pre{margin:0;padding:16px;font-size:13px;line-height:1.5;white-space:pre;overflow:auto;direction:ltr;text-align:left}
</style>
</head>
<body>
<div class="bar"><button id="copy" disabled>Copy code / نسخ الكود</button><span id="msg">...</span></div>
<pre id="code"></pre>
<script>
var text = '';
var fparam = new URLSearchParams(location.search).get('f');
var file = (fparam === 'format' || fparam === 'cleanup') ? fparam + '.txt' : 'code.txt';
fetch(file + '?t=' + Date.now(), {cache: 'no-store'}).then(function(r){ return r.text(); }).then(function(t){
  text = t;
  document.getElementById('code').textContent = t;
  document.getElementById('copy').disabled = false;
  document.getElementById('msg').textContent = t.split('\n').length + ' lines';
});
document.getElementById('copy').onclick = function(){
  navigator.clipboard.writeText(text).then(function(){
    document.getElementById('msg').textContent = '✅ تم النسخ';
  });
};
</script>
</body>
</html>
